<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketPutter</title>
<style>
  :root { --bg:#F4EFE6; --card:#FFFFFF; --ink:#1A1A17; --muted:#6B6A63; --accent:#1E4D3A; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding:24px 16px; }
  main { max-width:680px; margin:0 auto; }
  .card { background:var(--card); border-radius:16px; padding:32px 28px; box-shadow:0 1px 3px rgba(26,26,23,.08); }
  h1 { color:var(--accent); font-size:28px; margin-bottom:6px; }
  p.tag { color:var(--muted); margin-bottom:24px; }
  ul { list-style:none; }
  li { margin:12px 0; }
  a { color:var(--accent); font-weight:600; text-decoration:none; border-bottom:1px solid rgba(30,77,58,.35); }
  a:hover { border-bottom-color:var(--accent); }
  footer { text-align:center; color:var(--muted); font-size:13px; margin-top:28px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>PocketPutter</h1>
    <p class="tag">Turn your iPhone into a putting studio — face-to-path, ball speed, and roll-out distance from a single overhead camera. Requires iPhone 13 or newer (240&nbsp;fps camera).</p>
    <ul>
      <li><a href="support.html">Support &amp; setup guide</a></li>
      <li><a href="privacy.html">Privacy policy</a></li>
    </ul>
  </div>
  <footer>VisionTech Sports</footer>
</main>
</body>
</html>
